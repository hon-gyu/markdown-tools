name: Release oyster-zed

on:
  push:
    tags: ["oyster-zed-v*"]

permissions:
  contents: write

jobs:
  release:
    name: Cut GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches extension.toml and Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#oyster-zed-v}"
          ext=$(sed -n 's/^version = "\(.*\)"$/\1/p' pkg/oyster-zed/extension.toml)
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' pkg/oyster-zed/Cargo.toml | head -1)
          if [ "$ext" != "$crate" ]; then
            echo "::error::extension.toml ($ext) and Cargo.toml ($crate) disagree"
            exit 1
          fi
          if [ "$tag" != "$ext" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $ext"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches extension.toml and Cargo.toml at $ext"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git tag -l 'oyster-zed-v*' --sort=-v:refname \
                   | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$prev" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --generate-notes --notes-start-tag "$prev"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
